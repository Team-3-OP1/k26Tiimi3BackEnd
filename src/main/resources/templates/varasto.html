<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Varasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Varasto</h3>
        <a th:href="@{/homepage}" class="btn btn-outline-secondary btn-sm">Etusivu</a>
      </div>
      <p class="text-muted">Kun tuote toimitetaan asiakkaalle, varastomäärä vähenee yhdellä.</p>
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
          <thead class="table-dark">
            <tr>
              <th>Nimi</th>
              <th>Tyyppi</th>
              <th>Koko</th>
              <th>Varastossa</th>
              <th>Toiminto</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="tuote : ${tuotteet}">
              <td th:text="${tuote.name}"></td>
              <td th:text="${tuote.tyyppi != null ? tuote.tyyppi.nimi : '-'}"></td>
              <td th:text="${tuote.koko != null ? tuote.koko : '-'}"></td>
              <td>
                <span th:text="${tuote.varastoMaara + ' kpl'}"></span>
                <span th:if="${tuote.varastoMaara <= 0}" class="badge bg-danger ms-1">Loppu</span>
              </td>
              <td>
                <form th:action="@{/toimita/{id}(id=${tuote.id})}" method="post" style="display:inline">
                  <button type="submit" class="btn btn-success btn-sm" th:disabled="${tuote.varastoMaara <= 0}">Toimita asiakkaalle</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
