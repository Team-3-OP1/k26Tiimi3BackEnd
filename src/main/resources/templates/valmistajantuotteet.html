<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Tuotteet – ' + ${valmistaja.name}">Valmistajan tuotteet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="${valmistaja.name} + ' – tuotteet'"></h3>
        <div class="d-flex gap-2">
          <a th:href="@{/valmistajat}" class="btn btn-outline-secondary btn-sm">Valmistajat</a>
          <a th:href="@{/homepage}" class="btn btn-outline-dark btn-sm">Etusivu</a>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
          <thead class="table-dark">
            <tr>
              <th>Nimi</th>
              <th>Tyyppi</th>
              <th>Koko</th>
              <th>Hinta</th>
              <th>Toiminnot</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="tuote : ${tuotteet}">
              <td th:text="${tuote.name}"></td>
              <td th:text="${tuote.tyyppi != null ? tuote.tyyppi.nimi : '-'}"></td>
              <td th:text="${tuote.koko != null ? tuote.koko : '-'}"></td>
              <td th:text="${tuote.price + ' €'}"></td>
              <td>
                <div class="d-flex gap-1">
                  <a th:href="@{/edit/{id}(id=${tuote.id})}" class="btn btn-warning btn-sm">Muokkaa</a>
                  <a th:href="@{/delete/{id}(id=${tuote.id})}"
                     onclick="return confirm('Haluatko varmasti poistaa tämän tuotteen?');"
                     class="btn btn-danger btn-sm">Poista</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
