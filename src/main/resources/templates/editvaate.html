<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muokkaa tuotetta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-4" style="max-width:600px">
      <h3 class="mb-4">Muokkaa tuotetta</h3>
      <div class="card p-4 shadow-sm">
        <form th:action="@{/tallenna}" th:object="${vaate}" method="post">
          <input type="hidden" th:field="*{id}" />

          <div class="mb-3">
            <label class="form-label">Nimi</label>
            <input type="text" th:field="*{name}" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Tyyppi</label>
            <select name="tyyppiId" id="tyyppiSelect" class="form-select" onchange="paivitaKoko()" required>
              <option value="" disabled>Valitse tyyppi</option>
              <option th:each="t : ${tyypit}"
                      th:value="${t.id}"
                      th:selected="${vaate.tyyppi != null and vaate.tyyppi.id == t.id}"
                      th:text="${t.nimi}"></option>
            </select>
          </div>

          <div id="kokoRivi" class="mb-3">
            <label class="form-label">Koko (vain vaatteille)</label>
            <select th:field="*{koko}" class="form-select">
              <option value="">-- Ei kokoa --</option>
              <option th:each="k : ${kokovalinnat}" th:value="${k}" th:text="${k}"></option>
            </select>
            <div class="text-danger small" th:if="${kokoVirhe}" th:text="${kokoVirhe}"></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Hinta (€)</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" />
          </div>

          <div class="mb-3">
            <label class="form-label">Varastomäärä</label>
            <input type="number" min="0" th:field="*{varastoMaara}" class="form-control" />
            <div class="text-danger small" th:if="${#fields.hasErrors('varastoMaara')}" th:errors="*{varastoMaara}"></div>
          </div>

          <div class="mb-4">
            <label class="form-label">Valmistaja</label>
            <select th:field="*{valmistaja.id}" class="form-select" required>
              <option value="" disabled>Valitse valmistaja</option>
              <option th:each="v : ${valmistajat}" th:value="${v.id}" th:text="${v.name}"></option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Tallenna</button>
            <a th:href="@{/homepage}" class="btn btn-outline-secondary">Peruuta</a>
          </div>
        </form>
      </div>
    </div>
    <script th:inline="javascript">
      const nykyinenTyyppi = /*[[${vaate.tyyppi != null ? vaate.tyyppi.nimi : ''}]]*/ '';
      document.getElementById('kokoRivi').style.display =
        nykyinenTyyppi.toLowerCase() === 'vaate' ? 'block' : 'none';
      function paivitaKoko() {
        const select = document.getElementById('tyyppiSelect');
        const teksti = select.options[select.selectedIndex].text.toLowerCase();
        document.getElementById('kokoRivi').style.display = teksti === 'vaate' ? 'block' : 'none';
      }
    </script>
  </body>
</html>
