<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title th:text="{vaate.name}">Muokkaa vaatetta</title>
  </head>
  <body>
    <h2>Muokkaa tietoja</h2>

    <form th:action="@{/tallenna}" th:object="${vaate}" method="post">
      <input type="hidden" th:field="*{id}" />

      <label for="name">Nimi:</label>
      <input type="text" th:field="*{name}" />
      <br /><br />

      <label for="type">Tyyppi:</label>
      <input type="text" th:field="*{type}" />
      <br /><br />

      <label for="color">Väri:</label>
      <input type="text" th:field="*{color}" />
      <br /><br />

      <label for="size">Koko:</label>
      <input type="text" th:field="*{size}" />
      <br /><br />

      <label for="price">Hinta:</label>
      <input type="number" step="0.01" th:field="*{price}" />
      <br /><br />

      <label for="valmistaja">Valmistaja:</label>
      <select th:field="*{valmistaja.id}" required>
        <option value="" disabled th:selected="${vaate.valmistaja == null}">
          Valitse valmistaja
        </option>
        <option
          th:each="valmistaja : ${valmistajat}"
          th:value="${valmistaja.id}"
          th:text="${valmistaja.name}"
        ></option>
      </select>
      <br /><br />

      <button type="submit">Tallenna</button>
    </form>

    <br />
    <a th:href="@{/homepage}">Takaisin etusivulle</a>
  </body>
</html>
