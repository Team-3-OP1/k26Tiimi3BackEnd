<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muokkaa asiakasta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-4" style="max-width:500px">
      <h3 class="mb-4">Muokkaa asiakkaan tietoja</h3>
      <div class="card p-4 shadow-sm">
        <form th:action="@{/saveasiakas}" th:object="${asiakas}" method="post">
          <input type="hidden" th:field="*{id}" />
          <div class="mb-3">
            <label class="form-label">Etunimi</label>
            <input type="text" th:field="*{etunimi}" class="form-control" />
            <div class="text-danger small" th:if="${#fields.hasErrors('etunimi')}" th:errors="*{etunimi}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Sukunimi</label>
            <input type="text" th:field="*{sukunimi}" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Sähköposti</label>
            <input type="email" th:field="*{sposti}" class="form-control" required />
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Tallenna</button>
            <a th:href="@{/asiakkaat}" class="btn btn-outline-secondary">Peruuta</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
