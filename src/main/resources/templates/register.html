<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rekisteröidy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card shadow p-4" style="width:100%;max-width:400px">
      <h3 class="card-title text-center mb-4">Luo tili</h3>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <form th:action="@{/register}" method="post">
        <div class="mb-3">
          <label class="form-label">Käyttäjätunnus</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Salasana</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Luo tili</button>
      </form>
      <hr />
      <p class="text-center mb-0"><a th:href="@{/login}">Takaisin kirjautumiseen</a></p>
    </div>
  </body>
</html>
