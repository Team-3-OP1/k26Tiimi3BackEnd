<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asiakkaat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Rekisteröityneet asiakkaat</h3>
        <a th:href="@{/homepage}" class="btn btn-outline-secondary btn-sm">Etusivu</a>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
          <thead class="table-dark">
            <tr>
              <th>Etunimi</th>
              <th>Sukunimi</th>
              <th>Sähköposti</th>
              <th sec:authorize="hasRole('ADMIN')">Toiminnot</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="asiakas : ${asiakkaat}">
              <td th:text="${asiakas.etunimi}"></td>
              <td th:text="${asiakas.sukunimi}"></td>
              <td th:text="${asiakas.sposti}"></td>
              <td sec:authorize="hasRole('ADMIN')">
                <div class="d-flex gap-1">
                  <a th:href="@{/editasiakas/{id}(id=${asiakas.id})}" class="btn btn-warning btn-sm">Muokkaa</a>
                  <a th:href="@{/deleteasiakas/{id}(id=${asiakas.id})}"
                     onclick="return confirm('Haluatko varmasti poistaa tämän asiakkaan?');"
                     class="btn btn-danger btn-sm">Poista</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
