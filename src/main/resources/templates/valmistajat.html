<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valmistajat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Valmistajat</h3>
        <div class="d-flex gap-2">
          <a th:href="@{/homepage}" class="btn btn-outline-secondary btn-sm">Etusivu</a>
          <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Kirjaudu ulos</a>
        </div>
      </div>

      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div sec:authorize="hasRole('ADMIN')" class="mb-3">
        <a th:href="@{/addvalmistaja}" class="btn btn-primary btn-sm">+ Lisää valmistaja</a>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nimi</th>
              <th>Toiminnot</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="valmistaja : ${valmistajat}">
              <td th:text="${valmistaja.id}"></td>
              <td th:text="${valmistaja.name}"></td>
              <td>
                <div class="d-flex gap-1 flex-wrap">
                  <span sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/valmistaja/edit/{id}(id=${valmistaja.id})}" class="btn btn-warning btn-sm">Muokkaa</a>
                  </span>
                  <a th:href="@{/valmistaja/{id}/tuotteet(id=${valmistaja.id})}" class="btn btn-info btn-sm">Näytä tuotteet</a>
                  <span sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/deletevalmistaja/{id}(id=${valmistaja.id})}"
                       onclick="return confirm('Haluatko varmasti poistaa tämän valmistajan?');"
                       class="btn btn-danger btn-sm">Poista</a>
                  </span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
