<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Lisää tuote</title>
    <style>
      .error { color: red; }
      #kokoRivi { display: none; }
    </style>
  </head>
  <body>
    <h2>Lisää uusi tuote</h2>

    <form th:action="@{/tallenna}" th:object="${vaate}" method="post">
      <input type="hidden" th:field="*{id}" />

      <label>Nimi:</label>
      <input type="text" th:field="*{name}" />
      <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      <br /><br />

      <label>Tyyppi:</label>
      <select name="tyyppiId" id="tyyppiSelect" onchange="paivitaKoko()" required>
        <option value="" disabled selected>Valitse tyyppi</option>
        <option th:each="t : ${tyypit}" th:value="${t.id}" th:text="${t.nimi}"></option>
      </select>
      <div class="error" th:if="${tyyppiVirhe}" th:text="${tyyppiVirhe}"></div>
      <br /><br />

      <div id="kokoRivi">
        <label>Koko (vain vaatteille):</label>
        <select th:field="*{koko}">
          <option value="">-- Ei kokoa --</option>
          <option th:each="k : ${kokovalinnat}" th:value="${k}" th:text="${k}"></option>
        </select>
        <div class="error" th:if="${kokoVirhe}" th:text="${kokoVirhe}"></div>
        <br /><br />
      </div>

      <label>Hinta:</label>
      <input type="number" step="0.01" th:field="*{price}" />
      <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
      <br /><br />

      <label>Valmistaja:</label>
      <select th:field="*{valmistaja.id}" required>
        <option value="" disabled th:selected="${vaate.valmistaja == null}">Valitse valmistaja</option>
        <option th:each="v : ${valmistajat}" th:value="${v.id}" th:text="${v.name}"></option>
      </select>
      <div class="error" th:if="${valmistajaVirhe}" th:text="${valmistajaVirhe}"></div>
      <br /><br />

      <button type="submit">Tallenna</button>
    </form>

    <br />
    <a th:href="@{/homepage}">Takaisin etusivulle</a>

    <script>
      function paivitaKoko() {
        const select = document.getElementById('tyyppiSelect');
        const teksti = select.options[select.selectedIndex].text.toLowerCase();
        document.getElementById('kokoRivi').style.display = teksti === 'vaate' ? 'block' : 'none';
      }
    </script>
  </body>
</html>
