<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Lisää vaate</title>
    <style>
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Lisää uusi vaate</h2>

    <form th:action="@{/tallenna}" th:object="${vaate}" method="post">
      <input type="hidden" th:field="*{id}" />

      <label>Nimi:</label>
      <input type="text" th:field="*{name}" />
      <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      <br /><br />

      <label>Tyyppi:</label>
      <input type="text" th:field="*{type}" />
      <br /><br />

      <label>Väri:</label>
      <input type="text" th:field="*{color}" />
      <br /><br />

      <label>Koko:</label>
      <input type="text" th:field="*{size}" />
      <br /><br />

      <label>Hinta:</label>
      <input type="number" step="0.01" th:field="*{price}" />
      <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
      <br /><br />

      <label>Valmistaja:</label>
      <select th:field="*{valmistaja.id}" required>
        <option value="" disabled th:selected="${vaate.valmistaja == null}">
          Valitse valmistaja
        </option>
        <option
          th:each="valmistaja : ${valmistajat}"
          th:value="${valmistaja.id}"
          th:text="${valmistaja.name}"
        ></option>
      </select>
      <div class="error" th:if="${valmistajaVirhe}" th:text="${valmistajaVirhe}"></div>
      <br /><br />

      <button type="submit">Tallenna</button>
    </form>

    <br />
    <a th:href="@{/homepage}">Takaisin etusivulle</a>
  </body>
</html>
