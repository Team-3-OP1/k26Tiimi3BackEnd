<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Koiravaatekauppa</title>
  </head>
  <body>
    <h1>Koiravaatekauppa</h1>

    <a th:href="@{/addvaate}">Lisää uusi vaate</a>
    |
    <a th:href="@{/addvalmistaja}">Lisää uusi valmistaja</a>
    |
    <a th:href="@{/valmistajat}">Katso valmistajat</a>
    <h2>Added Vaatteet:</h2>
    <div th:if="${vaatteet.isEmpty()}">
      <p>No items added yet.</p>
    </div>

    <table border="1" th:if="${!vaatteet.isEmpty()}">
      <tr>
        <th>Nimi</th>
        <th>Tyyppi</th>
        <th>Väri</th>
        <th>Koko</th>
        <th>Hinta</th>
        <th>Valmistaja</th>
        <th>Toiminnot</th>
      </tr>

      <tr th:each="vaate : ${vaatteet}">
        <td th:text="${vaate.name}"></td>
        <td th:text="${vaate.type}"></td>
        <td th:text="${vaate.color}"></td>
        <td th:text="${vaate.size}"></td>
        <td th:text="${vaate.price}"></td>
        <td
          th:text="${vaate.valmistaja != null ? vaate.valmistaja.name : 'Tuntematon'}"
        ></td>
        <td>
          <a th:href="@{/edit/{id}(id=${vaate.id})}">
            <button type="button">Muokkaa</button>
          </a>
          <a
            th:href="@{/delete/{id}(id=${vaate.id})}"
            onclick="
              return confirm('Haluatko varmasti poistaa tämän vaatteen?');
            "
          >
            <button type="button">Poista</button>
          </a>
        </td>
      </tr>
    </table>
  </body>
</html>
