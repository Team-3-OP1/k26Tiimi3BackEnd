<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <title>Koiravaatekauppa</title>
  </head>
  <body>
    <h1>Koiravaatekauppa</h1>

    <p>
      Kirjautunut: <span sec:authentication="name"></span>
      |
      <a th:href="@{/logout}">Kirjaudu ulos</a>
    </p>

    <div sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/addvaate}">Lisää uusi tuote</a>
      |
      <a th:href="@{/addvalmistaja}">Lisää uusi valmistaja</a>
      |
      <a th:href="@{/addasiakas}">Lisää uusi asiakas</a>
      |
      <a th:href="@{/asiakkaat}">Katso asiakkaat</a>
    </div>

    <a th:href="@{/valmistajat}">Katso valmistajat</a>
    <br /><br />

    <a th:href="@{/saatavuus}">Katso tuotteiden saatavuus</a>
    |
    <a th:href="@{/varasto}">Katso varasto</a>
    |
    <a th:href="@{/paivitavarasto}">Päivitä varastomääriä</a>
    <h2>Tuotteet:</h2>

    <table border="1">
      <thead>
        <tr>
          <th>Nimi</th>
          <th>Tyyppi</th>
          <th>Koko</th>
          <th>Hinta</th>
          <th>Varastossa</th>
          <th>Valmistaja</th>
          <th sec:authorize="hasRole('ADMIN')">Toiminnot</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="tuote : ${tuotteet}">
          <td th:text="${tuote.name}"></td>
          <td th:text="${tuote.tyyppi != null ? tuote.tyyppi.nimi : '-'}"></td>
          <td th:text="${tuote.koko != null ? tuote.koko : '-'}"></td>
          <td th:text="${tuote.price}"></td>
          <td th:text="${tuote.varastoMaara + ' kpl'}"></td>
          <td
            th:text="${tuote.valmistaja != null ? tuote.valmistaja.name : 'Tuntematon'}"
          ></td>
          <td sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/edit/{id}(id=${tuote.id})}">
              <button type="button">Muokkaa</button>
            </a>

            <form
              th:action="@{/toimita/{id}(id=${tuote.id})}"
              method="post"
              style="display: inline"
            >
              <button type="submit" th:disabled="${tuote.varastoMaara <= 0}">
                Toimita asiakkaalle
              </button>
            </form>

            <a
              th:href="@{/delete/{id}(id=${tuote.id})}"
              onclick="
                return confirm('Haluatko varmasti poistaa tämän tuotteen?');
              "
            >
              <button type="button">Poista</button>
            </a>

            <span th:if="${tuote.varastoMaara <= 0}"> Ei saatavilla </span>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
