spring.application.name=pro

# Active Spring profile. This decides which database configuration file is loaded.
spring.profiles.active=supabase

# JWT settings (read from environment variables when available)
# Use the syntax ${ENV:default} so the app has safe defaults for local development.
jwt.secret=${JWT_SECRET:change-me-please-very-secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
